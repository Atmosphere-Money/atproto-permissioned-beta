name: build-permissioned-beta-pds

on:
  push:
    branches:
      - codex/permissioned-beta-integration-bddc99
  workflow_dispatch:

env:
  IMAGE: ghcr.io/atmosphere-money/atproto-permissioned-beta
  EXPECTED_UPSTREAM_MAIN: 1307a874f656a63d751d80ae4945580ce92ea4f5
  EXPECTED_PERMISSIONED_HEAD: bddc99fb24c34b4078b9bf65837283f37b49ab66

jobs:
  build:
    if: github.repository == 'Atmosphere-Money/atproto-permissioned-beta'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact integration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Verify immutable integration parents
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^1)" = "${EXPECTED_UPSTREAM_MAIN}"
          test "$(git rev-parse HEAD^2)" = "${EXPECTED_PERMISSIONED_HEAD}"
          test -z "$(git status --porcelain)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=pds-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            io.atmosphere.permissioned-beta.upstream-main=${{ env.EXPECTED_UPSTREAM_MAIN }}
            io.atmosphere.permissioned-beta.permissioned-head=${{ env.EXPECTED_PERMISSIONED_HEAD }}
            io.atmosphere.permissioned-beta.platform=linux/amd64

      - name: Build and push signed-input image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./services/pds/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify keyless signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          cosign verify \
            --certificate-identity "https://github.com/Atmosphere-Money/atproto-permissioned-beta/.github/workflows/build-permissioned-beta-pds.yml@refs/heads/codex/permissioned-beta-integration-bddc99" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            echo "### Permissioned beta PDS"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Provenance: \`mode=max\`"
            echo "- SBOM: enabled"
            echo "- Signature: keyless Cosign"
          } >> "${GITHUB_STEP_SUMMARY}"
